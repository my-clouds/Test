<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENT 암호화 도구</title>
<style>
:root{
  --bg:#f3f5f4; --panel:#ffffff; --ink:#1b2622; --muted:#66746e; --line:#d3dbd7;
  --accent:#1f6f5c; --accent-ink:#ffffff; --danger:#b3372f; --ok:#1f6f5c;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#101614; --panel:#18211e; --ink:#e4ece8; --muted:#8fa19a; --line:#2b3833;
    --accent:#4bb89b; --accent-ink:#0c1512; --danger:#e8746c; --ok:#4bb89b; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:20px 16px 48px}
main{max-width:720px;margin:0 auto}
h1{font-size:1.35rem;margin:8px 0 2px}
.sub{color:var(--muted);margin:0 0 20px;font-size:.9rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:.88rem;margin-bottom:6px}
input[type=password],input[type=text],input[type=number],textarea{
  width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;font:inherit}
textarea{min-height:150px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;word-break:break-all}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{margin-bottom:14px}
button{font:inherit;font-weight:600;border-radius:6px;padding:10px 16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:wait}
.frow{display:flex;gap:8px;margin-bottom:8px}
.frow input{flex:1 1 auto;min-width:0}
.frow button{flex:0 0 auto;padding:8px 12px;color:var(--muted)}
.fhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.fhead label{margin:0}
.fhead span{color:var(--muted);font-size:.82rem}
.opts{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin-bottom:14px;align-items:center}
.opts label{display:inline;font-weight:400;margin:0}
.opts input[type=number]{width:90px;padding:6px 8px}
#status{min-height:1.4em;font-size:.88rem;margin:8px 0 0}
#status.err{color:var(--danger)} #status.ok{color:var(--ok)}
#qr{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#qr[hidden]{display:none}
#qr video{max-width:100%;max-height:70vh;border-radius:10px;background:#000}
.hint{color:var(--muted);font-size:.8rem;margin-top:6px}
@media (prefers-reduced-motion: no-preference){ button{transition:opacity .15s} }
</style>
</head>
<body>
<main>
  <h1>ENT 암호화 도구</h1>
  <p class="sub">브라우저 안에서만 암호화·복호화합니다. 입력한 내용은 서버로 전송되지 않습니다.</p>

  <div class="card">
    <div class="field">
      <div class="fhead">
        <label for="pw0">비밀번호 칸</label>
        <span id="count"></span>
      </div>
      <div id="fields"></div>
      <div class="row">
        <button id="add" type="button">칸 추가</button>
        <span class="opts" style="margin:0"><span><input id="show" type="checkbox"> <label for="show">비밀번호 보기</label></span></span>
      </div>
      <div class="hint">비워 둔 칸은 없는 것으로 처리합니다. 칸의 개수와 순서가 키에 함께 반영되므로, 복호화할 때도 같은 개수와 순서로 입력해야 합니다.</div>
    </div>

    <div class="field">
      <label for="io">텍스트 / ENT 문자열</label>
      <textarea id="io" spellcheck="false" placeholder="암호화할 텍스트를 입력하거나, 복호화할 ENT2:... 문자열을 붙여넣으세요."></textarea>
    </div>

    <div class="opts">
      <span><label for="mem">Argon2id 메모리(MB)</label> <input id="mem" type="number" min="16" max="1024" step="16" value="64"></span>
      <span><label for="iter">반복(t)</label> <input id="iter" type="number" min="1" max="20" value="3"></span>
      <span><input id="zip" type="checkbox" checked> <label for="zip">암호화 전 압축</label></span>
      <span><input id="hide" type="checkbox"> <label for="hide">칸 수 숨기기</label></span>
    </div>
    <div class="hint" style="margin:-6px 0 14px">체크하고 암호화하면 ENT에 비밀번호 칸 수를 남기지 않습니다. 이 경우 복호화할 때 칸이 자동으로 생기지 않으니, 칸 수를 직접 기억해서 입력해야 합니다. 체크를 풀면 칸 수를 다시 기록합니다.</div>

    <div class="row">
      <button id="enc" class="primary">암호화</button>
      <button id="dec">복호화</button>
      <button id="copy">결과 복사</button>
      <button id="save">.ent로 저장</button>
      <button id="open">.ent 열기</button>
      <input id="file" type="file" accept=".ent,text/plain" hidden>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </div>
</main>

<div id="qr" hidden>
  <video id="qrv" playsinline muted></video>
  <button id="qrx" type="button">닫기</button>
</div>

<script>
"use strict";
const MAGIC = "ENT2", KDF = "argon2id";
const MAX_MEM_KB = 1048576, MAX_T = 50, MAX_N = 10000;
const enc = new TextEncoder(), dec = new TextDecoder();

/* ---------- Base64URL (청크 변환으로 큰 데이터도 안전) ---------- */
function b64(u8){
  let s = "";
  for (let i = 0; i < u8.length; i += 0x8000)
    s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function unb64(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/");
  s += "=".repeat((4 - s.length % 4) % 4);
  const bin = atob(s), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}

/* ---------- 압축 ---------- */
async function pipe(bytes, stream){
  const out = new Blob([bytes]).stream().pipeThrough(stream);
  return new Uint8Array(await new Response(out).arrayBuffer());
}
const deflate = b => pipe(b, new CompressionStream("deflate"));
const inflate = b => pipe(b, new DecompressionStream("deflate"));

/* ---------- 비밀번호 칸 → 키 재료 ----------
   [칸 수][길이][바이트][길이][바이트]... 순서로 묶습니다.
   "a|b" 한 칸과 "a","b" 두 칸이 절대 같아지지 않고, 칸 수와 순서가 키에 들어갑니다. */
function packPasswords(list){
  const parts = list.map(s => enc.encode(s));
  const out = new Uint8Array(4 + parts.reduce((a, p) => a + 4 + p.length, 0));
  const dv = new DataView(out.buffer);
  let o = 0;
  dv.setUint32(o, list.length); o += 4;
  for (const p of parts){ dv.setUint32(o, p.length); o += 4; out.set(p, o); o += p.length; }
  return out;
}

async function deriveKey(pwList, salt, memKB, t){
  const raw = await hashwasm.argon2id({
    password: packPasswords(pwList), salt,
    parallelism: 1, iterations: t, memorySize: memKB,
    hashLength: 32, outputType: "binary"
  });
  return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt","decrypt"]);
}

/* ---------- 형식: ENT2:argon2id:메모리KB:t:칸수:압축(0|1):salt:iv:암호문
   칸 수 숨김 모드에서는 칸수 자리에 "-" 를 기록합니다. ---------- */
function parseEnt(str){
  const p = str.replace(/\s+/g, "").split(":");
  if (p.length !== 9 || p[0] !== MAGIC || p[1] !== KDF) throw new Error("format");
  const [, , mS, tS, nS, zS, saltS, ivS, ctS] = p;
  const m = Number(mS), t = Number(tS);
  const n = nS === "-" ? null : Number(nS);          // null = 칸 수 숨김
  const ok = Number.isInteger(m) && m >= 8 && m <= MAX_MEM_KB
          && Number.isInteger(t) && t >= 1 && t <= MAX_T
          && (n === null || (Number.isInteger(n) && n >= 1 && n <= MAX_N))
          && (zS === "0" || zS === "1");
  if (!ok) throw new Error("format");
  return { m, t, n, zip: zS === "1", saltS, ivS, ctS, head: p.slice(0, 8).join(":") };
}

async function encryptText(text, pwList, memMB, t, zip, hideN = false){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const memKB = memMB * 1024;
  const head = [MAGIC, KDF, memKB, t, hideN ? "-" : pwList.length, zip ? 1 : 0, b64(salt), b64(iv)].join(":");
  let data = enc.encode(text);
  if (zip) data = await deflate(data);
  const ct = await crypto.subtle.encrypt(
    { name:"AES-GCM", iv, additionalData: enc.encode(head) },
    await deriveKey(pwList, salt, memKB, t), data);
  return head + ":" + b64(new Uint8Array(ct));
}

async function decryptText(str, pwList){
  const h = parseEnt(str);
  if (h.n !== null && pwList.length !== h.n) throw new Error("count:" + h.n + ":" + pwList.length);
  let pt = new Uint8Array(await crypto.subtle.decrypt(
    { name:"AES-GCM", iv: unb64(h.ivS), additionalData: enc.encode(h.head) },
    await deriveKey(pwList, unb64(h.saltS), h.m, h.t), unb64(h.ctS)));
  if (h.zip) pt = await inflate(pt);
  return dec.decode(pt);
}

/*UI*/
/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const fieldsEl = $("fields");

function renumber(){
  const rows = fieldsEl.querySelectorAll(".frow");
  rows.forEach((r, i) => { r.querySelector("input").placeholder = "비밀번호 " + (i + 1); });
  const filled = filledValues().length;
  $("count").textContent = "입력된 칸 " + filled + "개 / 전체 " + rows.length + "칸";
}
function addField(value = "", focus = false){
  const row = document.createElement("div");
  row.className = "frow";
  const inp = document.createElement("input");
  inp.type = $("show").checked ? "text" : "password";
  inp.className = "pwf";
  inp.autocomplete = "off"; inp.spellcheck = false;
  inp.value = value;
  inp.addEventListener("input", renumber);
  const del = document.createElement("button");
  del.type = "button"; del.textContent = "삭제"; del.setAttribute("aria-label", "이 칸 삭제");
  del.onclick = () => {
    if (fieldsEl.children.length <= 1) inp.value = "";
    else row.remove();
    renumber();
  };
  const qr = document.createElement("button");
  qr.type = "button"; qr.textContent = "QR"; qr.setAttribute("aria-label", "QR 읽기");
  qr.onclick = () => readQR(inp);
  row.append(inp, qr, del);
  fieldsEl.append(row);
  renumber();
  if (focus) inp.focus();
}
/* ---------- QR 읽기: 카메라로 읽은 값을 해당 칸에 채웁니다 ---------- */
let qrStream = null, qrTimer = 0;
function closeQR(){
  clearTimeout(qrTimer);
  if (qrStream) qrStream.getTracks().forEach(t => t.stop());
  qrStream = null;
  $("qrv").srcObject = null;
  $("qr").hidden = true;
}
async function readQR(inp){
  if (!("BarcodeDetector" in window)) return status("이 브라우저는 QR 읽기를 지원하지 않습니다.", "err");
  try { qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }); }
  catch { return status("카메라를 사용할 수 없습니다.", "err"); }
  const det = new BarcodeDetector(), v = $("qrv");
  v.srcObject = qrStream;
  $("qr").hidden = false;
  try { await v.play(); } catch {}
  const tick = async () => {
    if (!qrStream) return;
    try {
      const r = await det.detect(v);
      if (qrStream && r.length && r[0].rawValue){
        inp.value = r[0].rawValue;
        closeQR(); renumber();
        return status("QR을 읽었습니다.", "ok");
      }
    } catch {}
    qrTimer = setTimeout(tick, 150);
  };
  tick();
}
$("qrx").onclick = closeQR;

const allValues = () => [...fieldsEl.querySelectorAll(".pwf")].map(i => i.value);
const filledValues = () => allValues().filter(v => v !== "");   // 빈 칸은 없는 것으로 처리

function setFields(values, minCount){
  fieldsEl.innerHTML = "";
  const n = Math.max(values.length, minCount, 1);
  for (let i = 0; i < n; i++) addField(values[i] || "");
}

$("add").onclick = () => addField("", true);
$("show").onchange = () => {
  const t = $("show").checked ? "text" : "password";
  fieldsEl.querySelectorAll(".pwf").forEach(i => { i.type = t; });
};

/* ENT 문자열을 불러오면 헤더의 칸 수에 맞춰 칸을 만들어 줍니다 */
function syncFieldsFromEnt(){
  let h;
  try { h = parseEnt($("io").value.trim()); } catch { return false; }
  if (h.n === null){
    status("이 ENT는 칸 수가 숨겨져 있습니다. 비밀번호를 만들 때와 같은 개수·순서로 입력하세요.", "ok");
    return true;
  }
  const filled = filledValues();
  setFields(filled, h.n);
  status("이 ENT는 비밀번호 " + h.n + "개가 필요합니다. 칸을 " + h.n + "개로 맞췄습니다.", "ok");
  return true;
}
$("io").addEventListener("input", syncFieldsFromEnt);

const status = (msg, cls = "") => { const s = $("status"); s.textContent = msg; s.className = cls; };

async function run(fn){
  const btns = document.querySelectorAll("button");
  btns.forEach(b => b.disabled = true);
  status("처리 중… (Argon2id 계산에 잠시 걸립니다)");
  await new Promise(r => setTimeout(r, 30));
  try { await fn(); }
  catch (e) {
    const m = String(e && e.message);
    if (m === "format") status("ENT 형식이 올바르지 않습니다.", "err");
    else if (m.startsWith("count:")) {
      const [, need, have] = m.split(":");
      status("이 ENT는 비밀번호 " + need + "개가 필요합니다. 현재 " + have + "개가 입력되어 있습니다.", "err");
    }
    else if (e && e.name === "OperationError") status("복호화에 실패했습니다. 비밀번호(개수·순서 포함)가 틀렸거나 파일이 손상되었습니다.", "err");
    else status("처리에 실패했습니다. 메모리 설정을 낮춰 보세요.", "err");
  }
  btns.forEach(b => b.disabled = false);
}

$("enc").onclick = () => run(async () => {
  const pw = filledValues(), text = $("io").value;
  if (!pw.length) return status("비밀번호를 한 칸 이상 입력하세요.", "err");
  if (pw.length > MAX_N) return status("비밀번호 칸은 최대 " + MAX_N + "개까지 지원합니다.", "err");
  if (!text) return status("암호화할 텍스트를 입력하세요.", "err");
  const mem = Math.min(1024, Math.max(16, parseInt($("mem").value) || 64));
  const t = Math.min(MAX_T, Math.max(1, parseInt($("iter").value) || 3));
  $("io").value = await encryptText(text, pw, mem, t, $("zip").checked, $("hide").checked);
  setFields(pw, 1);                      // 빈 칸 정리: 실제 사용한 칸만 남김
  status("암호화했습니다. (비밀번호 " + pw.length + "개" + ($("hide").checked ? ", 칸 수 숨김" : "") + ")", "ok");
});

$("dec").onclick = () => run(async () => {
  const str = $("io").value.trim();
  if (!str) return status("복호화할 ENT 문자열을 입력하세요.", "err");
  const pw = filledValues();
  if (!pw.length) return status("비밀번호를 입력하세요.", "err");
  $("io").value = await decryptText(str, pw);
  status("복호화했습니다.", "ok");
});

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("io").value); status("복사했습니다.", "ok"); }
  catch { $("io").select(); status("자동 복사에 실패했습니다. 선택된 텍스트를 직접 복사하세요.", "err"); }
};

$("save").onclick = () => {
  const v = $("io").value;
  if (!v) return status("저장할 내용이 없습니다.", "err");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([v], { type:"text/plain" }));
  a.download = "data.ent";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  status("data.ent로 저장했습니다.", "ok");
};

$("open").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  $("io").value = (await f.text()).trim();
  e.target.value = "";
  if (!syncFieldsFromEnt()) status(f.name + " 파일을 불러왔습니다.", "ok");
};

setFields([], 1);
</script>
</body>
</html>
